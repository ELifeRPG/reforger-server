name: Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/eliferpg/reforger-server
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t "$IMAGE:ci" .

      - name: Smoke test (config renders)
        run: |
          docker run --rm --entrypoint render-config.sh \
            -v "$PWD/mods.example.json:/reforger/mods.json:ro" -e MODS="5614BBCCBB55ED1C, AAAAAAAAAAAAAAAA" "$IMAGE:ci" \
            | jq -e '.game.scenarioId != "" and (has("rcon") | not)
                and ([.game.mods[].modId] == ["596AFBF40E2150FD", "5614BBCCBB55ED1C", "AAAAAAAAAAAAAAAA"])
                and .game.mods[1].version == "1.0.0"'
          echo '[{"name": "no id"}]' > bad-mods.json
          if docker run --rm --entrypoint render-config.sh -v "$PWD/bad-mods.json:/reforger/mods.json:ro" "$IMAGE:ci"; then
            echo "invalid mods file was accepted" >&2
            exit 1
          fi

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          SHA_TAG="sha-${GITHUB_SHA::7}"
          for tag in latest "$SHA_TAG"; do
            docker tag "$IMAGE:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
